name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能创建 Release 并上传附件

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT_PATH: "MEPlayerWindows.csproj"
  PUBLISH_DIR: "publish"
  # mpv 官方 Windows 动态库(libmpv-2.dll)的构建仓库
  MPV_REPO: "shinchiro/mpv-winbuild-cmake"
  # 资产文件名匹配关键字：x86_64-v3 版本性能更好；如需兼容更老 CPU 可改成 "mpv-dev-x86_64-2"
  MPV_ASSET_PATTERN: "mpv-dev-x86_64-v3-"
  # libmpv-2.dll 在仓库里的缓存压缩包路径（第一次下载后会自动提交到这里）
  MPV_CACHE_ZIP: "deps/libmpv-2.dll.zip"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 还原依赖
        run: dotnet restore "${{ env.PROJECT_PATH }}"


      - name: 获取最新 libmpv 发布信息
        id: mpv_release
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "MEPlayer-CI" }
          if ($env:GITHUB_TOKEN) {
            $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/${{ env.MPV_REPO }}/releases/latest"

          $asset = $release.assets | Where-Object { $_.name -like "*${{ env.MPV_ASSET_PATTERN }}*.7z" } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "未能在 ${{ env.MPV_REPO }} 最新 release 中找到匹配 '${{ env.MPV_ASSET_PATTERN }}*.7z' 的资产"
            exit 1
          }

          Write-Host "找到资产: $($asset.name)"
          echo "asset_name=$($asset.name)" >> $env:GITHUB_OUTPUT
          echo "asset_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          echo "mpv_tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 libmpv 压缩包
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ steps.mpv_release.outputs.asset_url }}" `
            -OutFile "mpv-dev.7z" -UserAgent "MEPlayer-CI"

      - name: 解压 libmpv-2.dll
        shell: pwsh
        run: |
          # windows-latest 自带 7z (Git for Windows / 7-Zip 均可能提供)，优先用系统 7z
          7z x mpv-dev.7z -ompv-dev -y

          $dll = Get-ChildItem -Path "mpv-dev" -Filter "libmpv-2.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
            Write-Error "压缩包内未找到 libmpv-2.dll"
            exit 1
          }

          # 覆盖到项目根目录，供 csproj 的 CopyToOutputDirectory 规则拾取
          Copy-Item $dll.FullName -Destination "libmpv-2.dll" -Force
          Write-Host "已放置 libmpv-2.dll，来源: $($dll.FullName)"

      # ---------- 编译发布 ----------
      - name: 发布 (win-x64, framework-dependent)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release
          -r win-x64
          --self-contained false
          -o "${{ env.PUBLISH_DIR }}"

      - name: 确保 libmpv-2.dll 位于发布目录
        shell: pwsh
        run: |
          Copy-Item "libmpv-2.dll" -Destination "${{ env.PUBLISH_DIR }}/libmpv-2.dll" -Force

      # ---------- 打包 ----------
      - name: 生成版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $ver = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $ver = "-test"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: 打包为 zip
        shell: pwsh
        run: |
          $zipName = "MEPlayer-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}/*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_ENV

      # ---------- 打 tag 时自动发布 Release ----------
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: ${{ env.zip_name }}
          name: MEPlayer test
          draft: false
          prerelease: true
